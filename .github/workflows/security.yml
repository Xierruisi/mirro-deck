name: Dependency security

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/workflows/security.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/workflows/security.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  cargo-audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit Cargo dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # Tauri's Linux WebKit/GTK3 stack still pulls these advisories.
          # Keep the upstream migration risk tracked in issue #23 while
          # continuing to fail the audit when any new advisory appears.
          ignore: >-
            RUSTSEC-2024-0370,
            RUSTSEC-2024-0411,
            RUSTSEC-2024-0412,
            RUSTSEC-2024-0413,
            RUSTSEC-2024-0414,
            RUSTSEC-2024-0415,
            RUSTSEC-2024-0416,
            RUSTSEC-2024-0417,
            RUSTSEC-2024-0418,
            RUSTSEC-2024-0419,
            RUSTSEC-2024-0420,
            RUSTSEC-2024-0429,
            RUSTSEC-2025-0075,
            RUSTSEC-2025-0080,
            RUSTSEC-2025-0081,
            RUSTSEC-2025-0098,
            RUSTSEC-2025-0100

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Detect dependency review support
        id: dependency-review-support
        shell: bash
        env:
          API_URL: >-
            ${{ github.api_url }}/repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          RESPONSE_FILE: ${{ runner.temp }}/dependency-review-support.json
        run: |
          status="$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL")"

          if [[ "$status" == "200" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "403" || "$status" == "404" ]] && jq --exit-status \
            '.message | contains("Dependency review is not supported") or . == "Not Found"' \
            "$RESPONSE_FILE" >/dev/null; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Dependency review skipped because Dependency graph is disabled.'
          else
            jq . "$RESPONSE_FILE"
            exit 1
          fi

      - name: Check out repository
        if: steps.dependency-review-support.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        if: steps.dependency-review-support.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: >-
            AGPL-1.0-only,
            AGPL-3.0-only,
            GPL-2.0-only,
            GPL-3.0-only,
            SSPL-1.0
